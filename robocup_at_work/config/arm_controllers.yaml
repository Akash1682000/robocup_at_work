# ros2_control config for the panda, loaded by gazebo_ros2_control
# (see urdf/control.urdf.xacro). 100 Hz matches the plugin loop.
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Finger PID gains. The weld holds the object, so p only needs to
    # detect contact. 2000 knocks R20 over, 200 was worse, 500 works best.
    # d stops the fingers bouncing off.
    pid_gains:
      panda_finger_joint1:
        p: 500.0
        i: 0.0
        d: 20.0
        i_clamp: 1.0
      panda_finger_joint2:
        p: 500.0
        i: 0.0
        d: 20.0
        i_clamp: 1.0

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

panda_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 1.0

panda_hand_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - panda_finger_joint1
      - panda_finger_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # loose tolerances, a closed gripper never reaches its setpoint
    constraints:
      goal_time: 0.0
      stopped_velocity_tolerance: 0.0
      panda_finger_joint1:
        goal: 0.04
      panda_finger_joint2:
        goal: 0.04
