# Franka velocity and acceleration limits (urdf has no acceleration).
# Half speed by default.
default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 0.5

joint_limits:
  panda_joint1: {has_velocity_limits: true, max_velocity: 2.1750, has_acceleration_limits: true, max_acceleration: 3.75}
  panda_joint2: {has_velocity_limits: true, max_velocity: 2.1750, has_acceleration_limits: true, max_acceleration: 1.875}
  panda_joint3: {has_velocity_limits: true, max_velocity: 2.1750, has_acceleration_limits: true, max_acceleration: 2.5}
  panda_joint4: {has_velocity_limits: true, max_velocity: 2.1750, has_acceleration_limits: true, max_acceleration: 3.125}
  panda_joint5: {has_velocity_limits: true, max_velocity: 2.6100, has_acceleration_limits: true, max_acceleration: 3.75}
  panda_joint6: {has_velocity_limits: true, max_velocity: 2.6100, has_acceleration_limits: true, max_acceleration: 5.0}
  panda_joint7: {has_velocity_limits: true, max_velocity: 2.6100, has_acceleration_limits: true, max_acceleration: 5.0}
  panda_finger_joint1: {has_velocity_limits: true, max_velocity: 0.2, has_acceleration_limits: true, max_acceleration: 1.0}
  panda_finger_joint2: {has_velocity_limits: true, max_velocity: 0.2, has_acceleration_limits: true, max_acceleration: 1.0}
